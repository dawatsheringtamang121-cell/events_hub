<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNEC Events Hub — Contact</title>
    
    <!-- 1. Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 2. Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- 3. Custom Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header id="top">
        <h1>JNEC Events Hub</h1>
        <nav>
            <a href="index.html" title="Go to home page">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container my-4">
        <h2>Contact Us</h2>

        <section id="contact-info">
            <h3>College Address</h3>
            <p>
                Jigme Namgyel Engineering College<br>
                Dewathang, Samdrup Jongkhar<br>
                Bhutan
            </p>

            <h3>Email</h3>
            <p>
                <a href="mailto:info@college.edu.bt">info@college.edu.bt</a>
            </p>

            <h3>Phone</h3>
            <p>+975 77XXXXXX</p>
        </section>

        <section id="map">
            <h3>Our Location</h3>
            <iframe
                src="https://www.google.com/maps?q=Jigme%20Namgyel%20Engineering%20College&output=embed"
                width="100%"
                height="350"
                style="border:0;"
                allowfullscreen=""
                loading="lazy">
            </iframe>
        </section>

        <section id="enquiry">
            <h3>Enquiry Form</h3>
            <form action="#" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message:</label>
                    <textarea id="message" name="message" rows="5" class="form-control" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 JNEC Events Hub</p>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
