<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNEC Events Hub — Register</title>

    <!-- 1. Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 2. Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- 3. Custom Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header id="top">
        <h1>JNEC Events Hub</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Register</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <div class="container py-4">
            <h2 class="mb-4">Event Registration</h2>

            <form action="#" method="post" enctype="multipart/form-data" id="regForm">
                <fieldset class="border p-3 mb-4 rounded">
                    <legend class="float-none w-auto px-2 fs-5 fw-bold">Personal Details</legend>
                    
                    <div class="mb-3">
                        <label for="fullname" class="form-label">Full name</label>
                        <input type="text" id="fullname" name="fullname" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" id="phone" name="phone" class="form-control">
                    </div>
                </fieldset>

                <fieldset class="border p-3 mb-4 rounded">
                    <legend class="float-none w-auto px-2 fs-5 fw-bold">Event Choice</legend>

                    <div class="mb-3">
                        <label for="event_id" class="form-label">Event</label>
                        <select id="event_id" name="event_id" class="form-select" required>
                            <option value="">-- choose an event --</option>
                            <option value="1">Tech Week Hackathon</option>
                            <option value="2">Losar Festival Night</option>
                            <option value="3">Inter-College Football</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-semibold">Food preference:</p>
                        <div class="form-check form-check-inline">
                            <input type="radio" id="veg" name="food" value="veg" class="form-check-input">
                            <label for="veg" class="form-check-label">Vegetarian</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" id="nonveg" name="food" value="nonveg" class="form-check-input">
                            <label for="nonveg" class="form-check-label">Non-vegetarian</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-semibold">Interested in:</p>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" id="volunteer" name="interests" value="volunteer" class="form-check-input">
                            <label for="volunteer" class="form-check-label">Volunteering</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" id="perform" name="interests" value="perform" class="form-check-input">
                            <label for="perform" class="form-check-label">Performing</label>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="border p-3 mb-4 rounded">
                    <legend class="float-none w-auto px-2 fs-5 fw-bold">Other</legend>

                    <div class="mb-3">
                        <label for="department" class="form-label">Department</label>
                        <select id="department" name="department" class="form-select">
                            <option value="it">Information Technology</option>
                            <option value="civil">Civil</option>
                            <option value="electrical">Electrical</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="remarks" class="form-label">Remarks</label>
                        <textarea id="remarks" name="remarks" rows="4" class="form-control"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="id_card" class="form-label">Student ID card (image)</label>
                        <input type="file" id="id_card" name="id_card" accept="image/*" class="form-control">
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-primary">Register</button>
                <button type="reset" class="btn btn-outline-secondary">Clear</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 JNEC Events Hub</p>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
